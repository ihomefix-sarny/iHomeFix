<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>iHomeFix</title>
  <meta name="theme-color" content="#0B5C3A" />
  <meta name="description" content="Ремонт телефонів, планшетів, ноутбуків у Сарнах — iHomeFix" />
  <link rel="icon" href="favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Syne:wght@700;800&display=swap" />
  <style>
    :root {
      --bg:#050805; --surface:#0b120d; --elev:#101a13; --fg:#eef8f1; --muted:#8aa392;
      --primary:#0d7a45; --bright:#1db954; --dim:#064528; --line:#1c3324; --ink:#03140a;
    }
    * { box-sizing:border-box }
    html,body { margin:0; background:var(--bg); color:var(--fg); font-family:Manrope,system-ui,sans-serif }
    a { color:inherit; text-decoration:none }
    button,input { font:inherit }
    .bar { position:sticky; top:0; z-index:40; background:var(--primary); border-bottom:1px solid var(--line) }
    .bar-in { max-width:64rem; margin:0 auto; display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:.5rem; padding:.5rem .75rem }
    .logo { width:3.25rem; height:3.25rem; border-radius:999px; border:2px solid var(--fg); object-fit:cover; box-shadow:0 0 24px rgb(29 185 84 / .55) }
    .ico { width:2.25rem; height:2.25rem; display:grid; place-items:center; border-radius:999px; background:var(--dim); color:var(--fg) }
    .ico svg { width:1.15rem; height:1.15rem; display:block }
    .row { display:flex; gap:.4rem; align-items:center }
    canvas.rain { position:fixed; inset:0; z-index:10; pointer-events:none }
    .side { position:fixed; top:6rem; z-index:11; width:13rem; background:transparent; pointer-events:none; overflow:visible }
    .side img {
      height:70vh; width:auto; max-width:13rem; object-fit:contain; background:transparent;
      mix-blend-mode:normal; filter:drop-shadow(0 18px 24px rgb(0 0 0 / .35));
      animation:breathe 4.8s ease-in-out infinite;
    }
    .left { left:0 } .right { right:0 }
    .left img { transform-origin:left center; object-position:left }
    .right img { transform-origin:right center; object-position:right; animation-delay:-2.4s }
    @keyframes breathe {
      0%,100% { transform:scale(1); opacity:.88 }
      50% { transform:scale(1.05); opacity:1 }
    }
    .shell { position:relative; z-index:20; max-width:56rem; margin:0 auto; min-height:calc(100vh - 4.5rem); border-left:1px solid rgb(138 163 146 / .6); border-right:1px solid rgb(138 163 146 / .6); background:var(--bg) }
    main { padding:2.5rem 1.25rem }
    h1,h2,h3 { font-family:Syne,sans-serif; margin:0 }
    .muted { color:var(--muted) }
    .pill { display:inline-flex; border:1px solid var(--line); background:var(--elev); border-radius:999px; padding:.25rem .75rem; font-size:.75rem; font-weight:800; color:var(--bright) }
    .glow { background:var(--primary); color:var(--fg); border:0; border-radius:999px; padding:.75rem 1.5rem; font-weight:800; cursor:pointer; animation:gp 2.8s ease-in-out infinite }
    @keyframes gp { 50% { box-shadow:0 0 28px 4px rgb(29 185 84 / .45) } }
    .hero { display:grid; gap:2rem }
    @media (min-width:768px) { .hero { grid-template-columns:1fr 1fr; align-items:center } }
    .card { overflow:hidden; border:1px solid var(--line); background:var(--elev); border-radius:1rem }
    .stage { background:radial-gradient(ellipse at 50% 42%, rgb(22 42 28 / .9), rgb(5 8 5 / .2) 62%), linear-gradient(#101a13,#050805); border-radius:1.25rem }
    .grid { display:grid; grid-template-columns:1fr 1fr; gap:.75rem }
    @media (min-width:640px) { .grid { grid-template-columns:1fr 1fr 1fr } }
    .ph { border:1px solid var(--line); background:var(--elev); border-radius:1rem; overflow:hidden }
    .ph:hover { border-color:var(--bright); transform:translateY(-4px); box-shadow:0 0 24px rgb(29 185 84 / .35) }
    .ph img { height:14rem; width:100%; object-fit:contain }
    .ph p { margin:0; padding:.15rem 0 }
    .pad { padding:.75rem }
    .nav { display:flex; gap:.5rem; overflow:auto; padding:.5rem 0 1rem }
    .chip { flex:0 0 auto; border-radius:999px; border:1px solid var(--line); background:var(--elev); color:var(--muted); padding:.4rem .75rem; font-size:.875rem; font-weight:800; cursor:pointer }
    .chip.on { background:var(--primary); color:var(--fg); border-color:var(--bright) }
    .box { border:1px solid var(--line); background:var(--elev); border-radius:.9rem; padding:1rem }
    .price { font-size:1.5rem; font-weight:800; color:var(--bright) }
    footer { border-top:1px solid var(--line); background:var(--surface); padding:2.5rem 1rem }
    .foot { display:flex; flex-wrap:wrap; gap:1.5rem; justify-content:space-between; align-items:center }
    input { width:100%; border:1px solid var(--line); background:var(--bg); color:var(--fg); border-radius:.6rem; padding:.7rem .8rem }
    label { font-size:.75rem; font-weight:800; color:var(--muted) }
    .err { color:#f88; font-size:.85rem; margin:.4rem 0 0 }
    .admin { margin-top:2.5rem; border:1px solid var(--bright); background:var(--elev); border-radius:1rem; padding:1.25rem }
    .admin h3 { margin-top:1.25rem }
    .thumbs { display:grid; grid-template-columns:1fr 1fr; gap:.5rem; max-height:20rem; overflow:auto }
    @media (min-width:640px) { .thumbs { grid-template-columns:1fr 1fr 1fr 1fr } }
    .thumb { border:1px solid var(--line); border-radius:.6rem; padding:.5rem; font-size:.75rem; cursor:pointer }
    .thumb img { height:5.5rem; width:100%; object-fit:contain; background:transparent }
    .admin-dot {
      display:inline; margin:0; padding:0 1px 0 2px; border:0; background:transparent;
      color:var(--bright); font-size:1.45rem; font-weight:900; line-height:.6; cursor:pointer;
      text-shadow:0 0 10px rgb(29 185 84 / .95); vertical-align:baseline;
    }
    .admin-dot:hover { color:#6cff9a }
    body.admin-win .side, body.admin-win canvas.rain, body.admin-win .bar { display:none !important }
    body.admin-win .shell { border:0; max-width:28rem }
    @media (max-width:1023px) { .side, canvas.rain { display:none } }
    @media (prefers-reduced-motion:reduce) { .side img, .glow { animation:none } }
  </style>
</head>
